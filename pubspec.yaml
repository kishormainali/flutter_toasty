name: flutter_toasty
description: "A Flutter package that provides a simple and customizable way to display toast messages in your Flutter applications. With Flutter Toasty, you can easily show informative and stylish toast notifications to enhance user experience and provide feedback on various actions within your app."
version: 1.0.3
homepage: https://github.com/kishormainali/flutter_toasty
repository: https://github.com/kishormainali/flutter_toasty

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.34.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_svg: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0


flutter:
  uses-material-design: true
  assets:
    - assets/
